name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Compiles the shared core plus the CLI and MCP server. Has to run before
      # the tests — the MCP integration test drives the compiled server.
      - name: Build CLI and MCP server
        run: npm run build:node

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      # The tool's own promise is that themes stay accessible. Proving it on the
      # shipped tokens keeps that honest.
      - name: Contrast gate — default theme
        run: node dist-node/bin/theme-lab.js check src/lib/__fixtures__/default-theme.css

      # Dogfooding: discover this app's own pairings from its stylesheets and
      # grade them. Confirmed failures fail the build; inferred ones warn.
      - name: Contrast gate — discovered from our own CSS
        run: node dist-node/bin/theme-lab.js check src
